spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver

  jpa:
    defer-datasource-initialization: true  # Garantisce che schema.sql sia eseguito prima di JPA
    hibernate:
      ddl-auto: none  # CRITICAL per Spring Boot 4
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: always  # Esegue schema.sql
      data-locations: ""    # Disabilita il caricamento di data.sql (evita che il seed di prod inquini i test)